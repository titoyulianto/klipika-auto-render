name: Klipika Auto Render & Publish

# Robot ini bakal bangun kalau dipanggil lewat API dari HP (repository_dispatch) 
# atau di-klik manual buat testing (workflow_dispatch)
on:
  repository_dispatch:
    types: [trigger-klipika]
  workflow_dispatch: 

jobs:
  render-and-upload:
    runs-on: ubuntu-latest # Ini spesifikasi server gratis 7GB RAM dari GitHub!

    steps:
    - name: Checkout Kode
      uses: actions/checkout@v3

    - name: Setup Node.js (Mesin Bahasa)
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install FFmpeg (Dapur Render Berat)
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: Install Library Tambahan
      run: npm install

    - name: Eksekusi Render & Auto-Upload YouTube
      env:
        # Menarik 3 Kunci Sakti dari brankas rahasia GitHub Secrets
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        
        # Menerima data naskah & perintah dari HP lu
        PAYLOAD_DARI_HP: ${{ toJSON(github.event.client_payload) }}
      run: node app.js
