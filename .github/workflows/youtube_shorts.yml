name: Klipika Auto Render & Publish

on:
  repository_dispatch:
    types: [trigger-klipika]
  workflow_dispatch: 

jobs:
  render-and-upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kode
      uses: actions/checkout@v3

    - name: Setup Node.js (Mesin Bahasa)
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Library Tambahan (YouTube API & Fetch)
      run: npm install googleapis node-fetch --no-audit --no-fund

    - name: Eksekusi Auto-Upload ke YouTube
      env:
        # Menarik 3 Kunci Sakti dari brankas rahasia GitHub Secrets
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        
        # Menerima data payload link video matang dari web lu
        VIDEO_URL: ${{ github.event.client_payload.finalVideoUrl }}
        VIDEO_TITLE: ${{ github.event.client_payload.judulVideo }}
        VIDEO_DESC: ${{ github.event.client_payload.deskripsiVideo }}
      run: node upload-script.js
